name: Update Grand Slam data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min at :07/:37 — odd minutes dodge GitHub's
                             # congested :00/:30 scheduler slots, where low-traffic
                             # repos' crons get skipped (observed: fired once in 3h)
  workflow_dispatch:           # run on demand from the Actions tab

permissions:
  contents: write              # needed to commit data.json

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (SHA-pinned)

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6 (SHA-pinned)
        with:
          python-version: "3.12"

      # GitHub's scheduler drops most of our :07/:37 triggers under load — during the
      # 2026 US Open it fired ~6x/day, leaving live scores 3-5h stale. So each run
      # refreshes REPEATEDLY on a 12-min tick for ~48 min instead of once, and we only
      # need the cron to land roughly hourly (which it does) for usable granularity.
      - name: Refresh on a loop (fetch -> highlights -> commit, every 12 min)
        run: |
          git config user.name  "slam-bot"
          git config user.email "actions@users.noreply.github.com"
          FAIL=
          for i in 1 2 3 4 5; do
            [ $i -gt 1 ] && sleep 720
            # exits 1 only once data.json is genuinely stale (>6h); a blip exits 0
            python fetch_data.py || { echo "fetch failed on tick $i (data left untouched)"; FAIL=1; }
            python build_highlights.py || true
            git add data.json champions.json highlights.json editions.json
            if ! git diff --staged --quiet; then
              git commit -m "Update data $(date -u +%FT%TZ)"
              git pull --rebase origin main && git push || echo "push failed on tick $i; next tick retries"
            fi
          done
          [ -z "$FAIL" ] || { echo "fetch reported stale data; failing the run so it is visible"; exit 1; }

      # Kick the Wrexham tracker: its own schedule has never fired (new repo),
      # while this cron is proven. Entirely optional — with no secret set, or on
      # any failure, this exits 0 and the Slam job is unaffected.
      - name: Ping wrexham-tracker
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.WXM_DISPATCH }}
        run: |
          [ -n "$TOKEN" ] || { echo "no WXM_DISPATCH secret; skipping"; exit 0; }
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/danpune/wrexham-tracker/dispatches \
            -d '{"event_type":"refresh"}' || true
